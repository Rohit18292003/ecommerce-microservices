spring:
  application:
    name: order-service

server:
  port: 8081

#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:8761/eureka/
#    register-with-eureka: true
#    fetch-registry: true

  cloud:
    openfeign:
      client:
        config:
          product-service:
            connectTimeout: 2000
            readTimeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true

        # Consider the last 5 calls
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5

        # At least 3 calls must happen before calculating failure rate
        minimumNumberOfCalls: 3

        # Open circuit if 50% or more calls fail
        failureRateThreshold: 50

        # Wait 10 seconds before testing recovery
        waitDurationInOpenState: 10s

        # Allow 2 test calls in HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 2

        # Automatically move to HALF_OPEN after waiting
        automaticTransitionFromOpenToHalfOpenEnabled: true

        # Consider slow calls as failures when they take too long
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
  timelimiter:
    instances:
      createProductService:
            timeoutDuration: 3s
            cancelRunningFuture: true
  bulkhead:
    instances:
          productService:
            maxConcurrentCalls: 2
            maxWaitDuration: 0
  retry:
    instances:
          productService:
            maxAttempts: 3
            waitDuration: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true